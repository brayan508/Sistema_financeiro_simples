<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div
      class="container vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="text-center">
        <div class="login-card">
          <div class="icon-circle mx-auto mb-3">
            <i class="bi bi-person-fill"></i>
          </div>

          <form>
            <div class="mb-2 text-start">
              <label class="form-label small">Nome ou Email:</label>
              <input
                type="email"
                class="form-control"
                placeholder="exemplo@gmail.com"
                id="email_usuario"
              />
            </div>

            <div class="mb-3 text-start">
              <label class="form-label small">Senha</label>
              <input
                type="password"
                class="form-control"
                placeholder="Digite sua senha"
                id="senha_usuario"
              />
            </div>

            <button class="btn btn-dark w-100" id="botao_login">Entrar</button>
          </form>
        </div>

        <a
          href="/html/criar_conta.html"
          class="text-secondary text-decoration-none mt-2 d-block"
        >
          Não tem uma conta?
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
