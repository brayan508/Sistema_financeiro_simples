<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/criar_conta.css" />
  </head>
  <body>
    <div
      class="container vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="text-center">
        <div class="register-card">
          <div class="icon-circle mx-auto mb-3">
            <i class="bi bi-person-fill"></i>
          </div>

          <form id="criarContaForm">
            <div class="row g-2 mb-3">
              <div class="col-md-4 text-start">
                <label class="form-label small">Nome de usuario:</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="nome_usuario"
                />
              </div>

              <div class="col-md-4 text-start">
                <label class="form-label small">Email:</label>
                <input
                  type="email"
                  class="form-control form-control-sm"
                  id="email"
                />
              </div>
            </div>

            <div class="row justify-content-center g-3 mb-3">
              <div class="col-md-4 text-start">
                <label class="form-label small">Senha:</label>
                <input
                  type="password"
                  class="form-control form-control-sm"
                  id="senha"
                />
              </div>

              <div class="col-md-4 text-start">
                <label class="form-label small">Repita a Senha:</label>
                <input
                  type="password"
                  class="form-control form-control-sm"
                  id="confirmar_senha"
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-dark px-5"
              id="CriarContaButton"
            >
              Criar
            </button>
          </form>
        </div>

        <a
          href="/index.html"
          class="d-block mt-3 text-secondary text-decoration-none"
        >
          Já tenho conta
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/criar_conta.js"></script>
  </body>
</html>
